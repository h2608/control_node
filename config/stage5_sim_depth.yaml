# 第五赛段仿真参数档（stage5_profile:=sim_depth）——里程定段尾 + 深度居中。
#
# 叠加顺序：stage5_sim.yaml -> stage5_sim_odometry.yaml -> 本文件。
# 因此本文件只写“深度横向闭环”这一件事，其余全部沿用里程主导档。
#
# 为什么需要它（2026-08-04 race.world 实测）：
# - 桥面（2_bridge 网格）世界坐标 x∈[2.872, 3.376]、y∈[7.661, 12.161]，
#   即宽 0.504 m、长 4.500 m，半宽只有 0.252 m；
# - 一次爬坡中机体相对中心线的真实横向偏差从 +0.070 m 单调漂到 +0.225 m，
#   离边缘只剩 2.7 cm，随后翻下桥；
# - 同一批帧里观测器 13 帧有 12 帧有效（92%），横向偏差偏置 -0.032 m、
#   标准差 0.011 m，航向标准差 0.016 rad —— 也就是说“看得见”，
#   只是以前没有任何东西去用它。
#
# 里程给的是沿路进度，永远给不出相对桥中心线的横向偏差；
# 这条回路是唯一能闭合它的东西。
#
# 注意：本档只对仿真成立。实体启用前必须先过
# STAGE5_PHYSICAL_REDESIGN_PLAN.md 的 G0（外参/标定）与 G1（样台离线验证），
# 下面的增益是 race.world 的量级，不是实体标定值。
/**:
  ros__parameters:
    p5_deck_lateral_enabled: true

    # 0.20 m 偏差 -> 0.14 m/s 侧移。0.40 的原值在环形赛道上不够：
    # 每条边都朝环内侧倾 11.7 度，机体持续下滑，0.40 只能把残差稳在
    # 0.19 m（边半宽 0.245 m），留 5 cm 余量。
    p5_deck_lateral_k_vy: 0.70
    p5_deck_lateral_k_wz: 0.80
    # 死区取观测器标准差的约 2 倍，居中时不抖。
    p5_deck_lateral_deadband_m: 0.02
    p5_deck_lateral_heading_deadband_rad: 0.02
    p5_deck_lateral_max_vy: 0.18
    p5_deck_lateral_max_wz: 0.25
    # 观测器 5 Hz：丢一帧正常，连丢两帧就不再按旧值转向。
    p5_deck_lateral_max_age_s: 1.0
    p5_deck_lateral_min_consecutive_valid: 2
    # 半桥面 0.252 m；超过这个值是拟合坏了，不是真姿态。
    p5_deck_lateral_max_plausible_offset_m: 0.40
    # 盲区里减速而不是继续按旧估计转向。
    p5_deck_lateral_blind_vx_scale: 0.5

    # 偏差过大时先归位再前进（2026-08-04 实测的决定性一项）。
    # 一号转角结束时机体离环形赛道上边中心 0.13 m，而内侧空洞只在
    # 0.14 m 外——比半个站姿宽度还近，第一步就有脚踩空。
    # 0.40 增益按每前进 1 m 修正 0.13 m 计，来不及。
    p5_deck_lateral_centre_first_offset_m: 0.06
    p5_deck_lateral_centre_first_release_m: 0.03
    p5_deck_lateral_centre_first_vx_scale: 0.0
    # 归位也要有上限：修不动就继续走，不能把可恢复的偏差拖成状态超时。
    p5_deck_lateral_centre_first_max_s: 6.0

    # 深度观测不可用时的里程兜底。
    # 双边提取器要求两侧都有低于桥面的证据；环形赛道每条边内侧是空洞、
    # 外侧是抬起的路缘，路缘只产生高于桥面的点，所以底边 27 s 里有 26 s
    # 报 edge_rows<6（机体全程直立行走，不是摔倒造成的）。
    # 里程兜底按段入口基准线保持，航向吸附到路线声明的 90 度栅格：
    # 一号转角实测收在 -3.053 rad 而赛道真值是 -pi，直接用入口航向
    # 在 3.23 m 上会横移 0.29 m，比半宽还大。
    p5_route_lateral_fallback: true
    p5_route_lateral_snap_heading: true

    # 只让爬坡段的深度观测参与横向闭环（计划书第 34 条）。
    #
    # 2026-08-05 两批 24 跑逐帧对真值：爬坡 n=184 相关 0.99 / rms 0.005 m，
    # 三号边 n=146 相关 0.18 / rms 0.136 m、偏置 +0.12 m（指向赛道外侧）。
    # 因果检验更直接——在三号边内部按当时选中的观测源分段统计真实漂移：
    #   深度在手   +0.19 ~ +0.25 m/m
    #   里程兜底   +0.02 ~ +0.04 m/m
    # 两批一致，每一跑都一致。三号边只有 0.5 m 是深度在手，却贡献了整段
    # 0.20 m 偏差里的 0.13 m，并且是该批全部剩余失败的来源。
    #
    # 一、二号边的深度帧同样准（相关 0.99），但两批加起来只有 17 帧有效，
    # 关掉它们等于什么都不改；把白名单收成"已验证的那一个面"更诚实。
    p5_deck_lateral_depth_states: 'P5_UP_SLOPE'

    # 段内横向偏离上限。半宽 0.245 m，0.30 m 表示机体已经骑在边缘之外；
    # 到这一步继续走只会走成一次假完赛。0.5 s（25 帧 @50 Hz）去抖。
    p5_route_max_cross_track_m: 0.30
    p5_route_cross_track_samples: 25

    # 段进度度量：along_track（沿路线声明航向栅格的投影）。
    # 2026-08-04 对可靠性批次的真值复核（计划 26 条）推翻了保守续用 path
    # 的理由：
    # - 直道由 exit_source=odometry 在进度达到 *_expected_m 时收尾，
    #   而 path 把居中侧移和腿式里程计的步频抖动都算成前进，只会多算：
    #   门控时刻实测多算 straight_1 +0.11~+0.17 m、straight_2 +0.34~
    #   +0.45 m、straight_3 +0.30~+0.69 m；
    # - 同一窗口内估计器沿路线投影的误差只有 -0.04~-0.15 m，且偏晚
    #   （安全侧）；
    # - 后果实测：三、四号转角在离转角中心 0.25~0.6 m 处提前触发，提前量
    #   几乎 1:1 变成下一条边入口的横向偏差（半宽只有 0.245 m），r05/r10
    #   都是带着 0.25~0.30 m 的入口偏差进入跳跃/下坡段后失败的。
    # - 原理由"唯一跑通的配置用的是 path"在复核后不再成立：那批 3/10 里
    #   有一次是假完赛（r07 开局摔下桥后在地面走完全程），真实基线 2/10。
    p5_route_progress_measure: along_track

    # along_track 度量下重新标定的段长（覆盖 stage5_sim_odometry 里按 path
    # 标定的 3.80/3.23/2.71/2.93）。标定式：几何门控点 - 该段实测的估计器
    # 投影欠读中位数。几何门控点 = 转角中心距(3.50/3.00/3.50) - 段尾真实
    # 前进量；up_slope 取真值复核中四次干净爬坡的 est_along 中位数，
    # 使一号转角触发点保持在已实测准确的位置。
    #
    # straight_3 的段尾前进量与其他直道不同（2026-08-04 冒烟跑实测）：
    # "0.4 m" 段尾段其实是 1.35 s 定时前进，且到四号转角的跳跃动作接手前
    # 机体还会以 0.3 m/s 惯性滑行——五次实测真实前进 0.50~0.70 m，另外
    # 三号转角的跳转本身就把机体带过转角中心 +0.06~+0.13 m。按此回算，
    # 逐跑的理想 expected 在 2.51~2.84，取 2.70 偏早侧：入角偏早只损失
    # 1:1 的横向偏差，过冲越过转角外缘（中心 +0.245 m）直接翻下赛道
    # （冒烟跑 expected=3.00 时四号转角过冲 0.50 m，机体摔出外缘）。
    # 3.75 -> 3.72（计划书第 36 条）：一号转角的进场系统性冲过转角中心。
    #
    # 三批 31 跑逐跑分解爬坡段收尾到 straight_1 入段的 y 位移（转角中心
    # y=12.410，爬坡沿 +y，所以入段时的 y 偏差**就是**冲过转角中心的量）：
    #   P5_AFTER_UP_SLOPE_FORWARD   中位 +0.611 m（0.520~0.637）
    #   P5_AFTER_UP_SLOPE_VELOCITY_CONTROL（原地转）中位 +0.131 m（0.117~0.145）
    #   合计进场位移                中位 +0.742 m，极稳
    # 也就是说爬坡的门必须在转角中心前 0.742 m 处触发；实测触发在 y=11.730，
    # 只提前了 0.680 m。差值 0.062 m 原样变成 straight_1 的入段偏差：
    # 实测中位 +0.080 m，而段内起伏只有 +0.040 m —— 入段偏差是主项。
    #
    # 根因是里程投影欠读：门在 along_track=3.75 触发时，真实 y 位移中位是
    # 3.832 m，欠读 0.082 m，而 expected_m 的标定没有把这一项算进去。
    #
    # 三个实测点（入段偏差取剔除再对齐跑后的中位数）：
    #   3.75 -> +0.083 m   完赛 6/11   straight_1 走出赛道 2/11
    #   3.72 -> +0.063 m   完赛 9/12   straight_1 走出赛道 0/12
    #   3.69 -> -0.038 m   完赛 7/12   straight_1 走出赛道 4/12
    #
    # **必须说清楚：这个参数与入段偏差的关系在这个样本量下解不出来。**
    # 3.75 与 3.72 的入段分布在统计上分不开（中位差 0.020 m，标准误 0.024 m），
    # 3.69 才明显更低。按 3.75/3.69 两点推出的"传递比 2.1"没有被中间点复现，
    # 所以那条推理是错的，不要照着它再外推。
    #
    # 取 3.72 的理由是**实测结果**，不是机理：它是四批里唯一一批 12 跑全部
    # 干净走完四条边（爬坡/一/二/三号边各 0 次走出赛道），三次失败全部是
    # 跳跃握手卡死（计划书第 33 条）。完赛率 6/11 -> 9/12 本身不显著
    # （Fisher p 约 0.4），可信的是"没有任何一跑掉下赛道"。
    #
    # 安全带实测 [-0.06, +0.10]，偏正——段内本身带 -0.05 m 的漂移
    # （入段 -0.057 活、-0.088 死；入段 +0.090 活、+0.139 死）。
    p5_route_up_slope_expected_m: 3.72
    p5_route_straight_1_expected_m: 3.02
    p5_route_straight_2_expected_m: 2.52
    p5_route_straight_3_expected_m: 2.70

    # 窗口只是 overrun=fault 的保险，不是门控；但旧上限 4.2/3.6/4.0 允许
    # 机体直接走出转角外缘（转角中心 + 半条横边 = +0.245 m）才触发。
    # 收紧到"宁可停在转角前，也不走下赛道"。
    p5_route_straight_1_min_m: 2.80
    p5_route_straight_1_max_m: 3.35
    p5_route_straight_2_min_m: 2.35
    p5_route_straight_2_max_m: 2.85
    p5_route_straight_3_min_m: 2.45
    p5_route_straight_3_max_m: 3.05

    # 入段深度完整性门（计划 25 条）：爬坡段（桥面双侧边缘齐全，观测器
    # 实测 92% 有效率）结束时必须已累计若干有效帧，否则机体不在赛道上。
    # 真实爬坡每次 40+ 帧（1 Hz 节流日志里 8-10 条），两次假完赛在段内
    # 都是 0 帧——它们只在入场台阶前的地面上拿到过有效帧，段内计数排除
    # 这些。环形边上双边提取器常年致盲（真实跑也会连续三段 0 帧），所以
    # 只在爬坡段判定，不做滚动连续盲段判定。
    p5_route_entry_depth_min_frames: 3
