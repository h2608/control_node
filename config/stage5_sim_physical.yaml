# 第五赛段仿真参数档（stage5_profile:=sim_physical）——race_physical.world。
#
# 叠加顺序：stage5_sim.yaml -> stage5_sim_odometry.yaml -> stage5_sim_depth.yaml
# -> 本文件。因此这里只写“黄色围栏被压平成地面胶带”之后必须改的那几件事。
#
# 为什么需要单独一档（2026-08-16 race_physical 六跑实测，
# stage5_test_logs/2026-08-16_race_physical/）：
#
# race.world 的 2_border/3_border 是**带碰撞的抬起网格**，与它所贴的那条边等高，
# 也就是说环形边在那个世界里根本不是 0.49 m 宽——两侧路缘把可站立面加宽了，
# 横向漂移撞到路缘就停住。race_physical 把它们压平成纯视觉的地面轮廓
# （物理赛道的规则是地面上 10 cm 胶带），环形边这才真的只有 0.49 m 宽、
# 两侧是 0.4 m 的跌落。同一套控制在两个世界里的结果：
#   race.world       43/48 = 90%
#   race_physical     0/6   （95% Wilson 0-39%，两个区间不重叠）
# 六跑里五跑死在一号边，全部是入段在赛道上、随后单调朝赛道外侧走出去。
#
# 逐帧真值分解出两项，两项都指向同一侧：
#   入段偏差   -0.060 ~ -0.099 m（真值，段入口）
#   段内漂移   约 -0.04 m/m，3.02 m 走完再加 -0.12 m
#   实测倾覆阈  |偏差| 约 0.11 ~ 0.12 m（半宽 0.245 m，但机体侧倾 0.48 rad，
#               先落空的是脚不是机体中心）
# 两项相加必然越界，所以这一档修的是这两项，不是把某个速度调慢。
/**:
  ros__parameters:
    # === 一、入段偏差：让里程基准线锚在深度定位上，而不是段入口位姿 ===
    #
    # 深度观测器在环形边上被 p5_deck_lateral_depth_states 压掉了转向权
    # （计划书第 34 条：race.world 的边上它带 +0.126 m 偏置）。但“不能直接
    # 转向”不等于“测得不准”——race_physical 三跑的一号边入段帧实测：
    #   r01 深度 -0.0877 真值 -0.0873
    #   r02 深度 -0.0690 真值 -0.066
    #   r05 深度 -0.0630 真值 -0.060
    # 误差 5 mm 以内。原来这一帧被整帧丢弃，里程兜底于是把基准线锁在入口位姿
    # 上，报 offset=0.0，把 -0.09 m 的入段偏差当成零误差一路保持到走出赛道。
    #
    # 打开锚定 + 允许被压制的深度帧参与锚定，基准线就落在赛道中心线上。
    p5_route_lateral_anchor_enabled: true
    p5_route_lateral_anchor_suppressed_depth: true

    # 锚定生效后，入段第一帧的 offset 就是真实的 -0.09 m，直接越过
    # centre_first 的 0.06 m 门限，于是原来的 vx_scale=0.0 会让机体在
    # 0.49 m 宽的倾斜边上原地横移最多 6 s。四足原地横移比走着横移更容易失稳，
    # 而且 45 s 的状态超时里没有这个预算（段长 3.02 m / 0.30 m·s⁻¹ 本身就要
    # 10 s 以上，里程还欠读）。改成减速而不是停住。
    p5_deck_lateral_centre_first_vx_scale: 0.4

    # === 二、段内漂移：给横向回路加积分项 ===
    #
    # 倾斜面上的扰动是常量（重力沿横向的分量），纯 P 回路对常量扰动只能收敛到
    # 一个常值误差。段里那个开环横移量 p5_right_slope_*_vy 就是对这个常量的
    # 手工标定值，而它是在**有路缘分担侧向力**的 race.world 上标出来的，
    # 在这里过量约 0.010 m·s⁻¹。实测 P 项确实在修（vy 从 0.133 压到 0.110），
    # 但只把漂移从 -0.010 压到 -0.008 m·s⁻¹，仍然走出去。
    #
    # 积分项把每段的开环横移量变成自校准量：不管标定值差多少，积分都会累到
    # 刚好抵消。Ti = k_vy / k_i_vy = 0.70 / 0.20 = 3.5 s，比机体横向响应的
    # 约 1 s 滞后慢三倍以上，留够相位裕度。
    # 上限 0.08 m·s⁻¹ = 允许把 0.1325 的开环值修正 60%；再多就不是配平错了，
    # 是估计出了问题，该由 CrossTrackGate 兜底而不是继续加权。
    p5_deck_lateral_k_i_vy: 0.20
    # 0.08 -> 0.12：二号边实测有 50% 的时刻顶在 0.08 上限上，说明这个上限
    # 本身在限制回路。开环值改对之后需求应该回到 0 附近，但留出的余量必须
    # 大于“标定可能错多少”，否则一旦标定又偏了，回路会再次悄悄饱和。
    p5_deck_lateral_max_i_vy: 0.12

    # 锚定量上限。环形边半宽 0.245 m，机体侧倾 0.48 rad 时实测 0.11~0.12 m
    # 就开始掉下去，所以入段一帧报 0.20 m 只可能是边缘拟合坏了。
    # 2026-08-16 实测：三号边入段被一帧 -0.206 m 锚死，整段照着这条错线走完。
    # 0.15 m 比实测的入段偏差极值（0.099 m）宽 50%，比会掉下去的偏差窄。
    p5_route_lateral_anchor_max_m: 0.15

    # === 三、转角：跳跃在这个世界里更容易失手，兜底必须够用 ===
    #
    # 二号转角的跳跃在 race_physical 里 5 跑失手 3 跑（2 跑握手卡死被
    # unwedge 拉回站立、1 跑直接摔下赛道）。卡死被拉回之后机体一度都没转，
    # 再对齐要补的是整整 90 度，而 6.0 s 的预算按实测 11 度/s 的原地转速
    # 只够 66 度：r02/r03 都是转到 -82 度、差 8 度时预算用光而判故障。
    # 90 度 / 11 度·s⁻¹ = 8.2 s，取 14 s 留 70% 余量；状态超时（45 s）
    # 仍然是硬上限，所以放宽预算不会把失败拖成无限等待。
    p5_route_realign_timeout_s: 14.0
    # 两次机会：一次给跳跃失手后的整圈补偿，一次给补偿本身没到位的情况。
    p5_route_realign_max_attempts: 2

    # 四号转角前的体态复位改成斜坡。一次到位等于把重心一步挪过整个 11.7 度
    # 横坡：实测机体 roll 从 -0.47 冲到 +0.55，在跳跃还没发出之前就从三号边
    # 内侧滑下去了（5 跑里 2 跑，都是走到这一步才失败的）。
    # 1.5 s 按 0.6 rad 的复位量算是 0.4 rad·s⁻¹，比腿迈一步慢，
    # 足以让支撑腿跟上重心的横向移动。
    p5_reset_body_ramp_s: 1.5

    # === 四、归位保持只在环形边上生效 ===
    #
    # “先归位再前进”是按环形边标定的：那里机体侧倾 0.48 rad，实测 0.11 m
    # 就掉下去，所以停下来横移是划算的。爬坡段不是——桥面 0.504 m 宽，
    # 0.08 m 的偏差横向回路自己就能修，而 vx 从 0.450 压到 0.180 m·s⁻¹
    # 之后机体上不了入口台阶：十二跑里两跑卡在坡底（y=8.05，z 从 0.30
    # 掉到 0.13），随后 40 s 一动不动直到状态超时。爬坡要的是动量。
    p5_deck_lateral_centre_first_states: 'P5_RIGHT_SLOPE_1,P5_RIGHT_SLOPE_2,P5_RIGHT_SLOPE_3'

    # === 五、转角起跳点 ===
    #
    # 每个转角的跳跃是固定动作，落点由起跳点决定，而起跳点 = 段尾里程门
    # + 1.35 s 定时前进。逐跑真值把成败分得很干净（2026-08-16 十二跑）：
    #
    #   二号转角（沿 -x 起跳，转角中心 x=-0.375）
    #     成功 6 跑起跳 x = -0.324 ~ -0.352
    #     摔下 2 跑起跳 x = -0.394, -0.401     <- 冲过转角中心
    #     跳跃卡死 2 跑   x = -0.365, -0.367
    #   三号转角（沿 +y 起跳，转角中心 y=15.405）
    #     成功 6 跑起跳 y = 15.310 ~ 15.388
    #     摔下 1 跑起跳 y = 15.422             <- 冲过转角中心
    #   四号转角（沿 +x 起跳，转角中心 x≈3.12）
    #     成功 2 跑起跳 x = 2.939, 2.951
    #     摔下 3 跑起跳 x = 2.880, 2.904, 2.933  <- 差得太远
    #
    # 二、三号转角要**少走**（越过转角中心就落到边外），四号转角要**多走**
    # （离转角太远就落不到平台上）。方向相反并不矛盾：三个跳跃的平移量不同，
    # 各自的理想起跳点也就不同。
    #
    # 每 0.01 m 的段长改动 1:1 地移动起跳点，所以按“把最差的一跑拉回成功区”
    # 取量：二号 -0.04（最差 -0.401 -> -0.361）、三号 -0.04、四号 +0.06
    # （最差 2.880 -> 2.940）。都比 race.world 那次把 straight_3 设成 3.00
    # 的教训（四号转角过冲 0.50 m 摔出外缘）小一个量级。
    # 2.98 的实测（十六跑十四次到二号转角）暴露出二号转角也有一道悬崖，
    # 而且方向与三号转角相同——冲过头就飞出去：
    #   起跳 x <= -0.363 的十二跑：转角 -90 ~ -96 度，落点全在边上
    #   起跳 x = -0.382：转 -130 度，落到 x=-1.156（边是 -0.62..-0.13）
    #   起跳 x = -0.428：转 +17 度，落到 x=-0.889
    # 当前起跳分布 -0.279 ~ -0.428（跨度 0.149 m）跨过了悬崖。
    # 2.93 把分布压到约 -0.22 ~ -0.37；低端比实测过的最低点（-0.279，
    # 转 -90.4 度并完赛）再低 0.06 m，低侧目前没有任何反例。
    p5_route_straight_1_expected_m: 2.93
    # 二号边续测（十三跑）：三号转角的跳跃有一道很陡的悬崖。起跳 y <= 15.378
    # 的十一跑转角都在 -92 ~ -97 度、落点都在边上；15.396 和 15.431 两跑
    # 直接转了 -153 / -159 度，落到 y=16.07/16.09，整个飞出赛道。
    # 2.48 时起跳分布是 15.295 ~ 15.431，跨过了悬崖。
    # 2.43 把分布压到约 15.24 ~ 15.38；低端比实测过的最低点（15.295，
    # 转 -92.4 度并完赛）再低 0.055 m，而低侧没有出现过任何问题。
    p5_route_straight_2_expected_m: 2.43
    #
    # 四号转角的续测（十三跑，跨两批）推翻了上面对四号的取值。逐跑把起跳点
    # 与**跳跃实际交付的转角**对上之后，关系是单调的，而且成败由转角决定：
    #   起跳 x  2.72  2.88  2.90  2.93  2.94  2.95  2.97  3.00  3.00  3.03  3.09
    #   转角    -21   -25   -7    -8    -54   -53   -5    -50   -47   -77   -76 度
    # 目标是 -90 度。原来按“成功的两跑起跳在 2.94/2.95”定的 +0.06 是把幸存
    # 当成了成功——那两跑其实只转了 -53 度，是靠再对齐救回来的。
    # 唯一两次干净完赛（r07 x=3.032 转 -77 度、r09 x=3.093 转 -76 度）都在
    # 最靠前的一档。段长每 +0.01 m 把起跳点推后约 +0.0115 m，
    # 2.76 -> 2.82 把中位起跳点从 3.00 推到约 3.07，落在实测最好的一段里。
    # 2.82 的实测结果（十六跑八次到四号转角）说明还不够远：
    #   起跳 x  2.92  2.98  2.99  2.99  3.00  3.00  3.02  3.04
    #   转角    -60   -9    -56   -24   -68   -55   -83   -87 度
    # 三次完赛全部来自最靠前的三档（2.997 / 3.017 / 3.037），
    # 而真正接近 -90 度的只有 3.037。再 +0.06 把中位起跳点推到约 3.07。
    # （2.88 已被下面第十节的 3.11 取代；YAML 后者生效，这里不再重复声明。）

    # === 六、翻倒闩锁：不要把摔下赛道的一跑走成假完赛 ===
    #
    # 2026-08-16 十二跑里唯一那次 P5_DONE 是**假的**：三号转角的跳跃把机体
    # 扔下边（真值 z 0.42 -> 0.236），机体滚过 3.14 rad 之后自己站了起来，
    # 落在三号边外侧 1.16 m 的地面上，然后满足了后面每一个里程窗口和转角
    # 校核，一路走到 P5_DONE。段内横向门看不见它——它量的是相对**本段入口
    # 基准线**的漂移，而机体是带着离线的位置进的段，所以读数是零。
    # 只有事后的真值复核发现了这件事。
    #
    # 1.0 rad 远超正常行走（环形边上抱持 0.48 rad 的侧倾姿态是常态），
    # 0.5 s（25 帧 @50 Hz）去抖。计划书第 37 条：翻滚毁掉的是位置估计，
    # 姿态是可信的，所以判据取姿态。
    p5_route_topple_limit_rad: 1.0
    p5_route_topple_samples: 25

    # === 七、段入口瞬变期间不转向：实测否决，保留为 0 ===
    #
    # 假设是：段入口的头半米是跳跃落地/体态切换的瞬变，回路在这时候纠正的是
    # 落地而不是航向误差，所以先别转。实测（十六跑）**反了**：
    #   爬坡超时 2/11 -> 7/16，一号边通过 10/12 -> 6/16，完赛 2/11 -> 1/16。
    # 日志给出的机理是一个死锁——按“走够 0.5 m 再接管”写的门，
    # 而机体正是**因为没有修正**才走不动：
    #   odometry progress 0.06/3.72 m, cmd=(0.450,0.000,0.000), entry-hold 0.06/0.50 m
    # 一连 40 s 停在 0.06 m。还有一跑在爬坡段横向漂到 -0.42 m 触发横向门。
    # 也就是说横向/航向修正不是卡住爬坡的原因，而是爬上去的原因。
    # 按里程设门永远有这个死锁；真要做只能按时间设，而那是另一个未验证的改动。
    p5_deck_lateral_engage_after_m: 0.0

    # === 八、把开环横移量设成实测值 ===
    #
    # 积分项在十二跑里稳定收敛，收敛值就是每段真正需要的横移量：
    #   一号边  开环 0.1325 + 积分 -0.019  = 0.114
    #   二号边  开环 0.0000 + 积分 +0.038  = 0.043
    #   三号边  开环 0.1100 + 积分 -0.008  = 0.098
    # 三条边的横坡都是 11.7 度、向机体右侧（环内）倾（直接量 3_slope.stl 的
    # 可站立顶面法向得到，三条边一致），所以确实需要一个向左的稳态横移量；
    # 原来的手工标定值只是各偏了 0.01~0.04。把开环值设成实测收敛值，
    # 积分就不必先花几秒抵消标定误差，那几秒的权限留给入段偏差。
    #
    # 二次实测（十六跑）推翻了二号边那个 0.043：把开环值设成 0.043 之后，
    # 积分项有 **50% 的时刻顶在 +0.08 的上限上**，段内稳态偏差仍有 +0.037，
    # 也就是说真实需求至少是 0.043 + 0.08 = 0.123，而不是 0.043。
    # 上一轮之所以读成 0.043，是因为那时开环值是 0.0、积分还在往上爬，
    # 取“后半段中位数”把仍在上升的过程量当成了收敛值。
    #
    # 修正后的三条边需求几乎相同——这本来就该如此：三条边是同一个 11.7 度
    # 横坡、同一个前进速度，需要的稳态横移量当然一样。
    #   一号边 0.114 + 0.000 = 0.114（积分从未触界）
    #   二号边 0.043 + 0.080 = 0.123（积分半数时刻触界，是下界估计）
    #   三号边 0.098 + 0.017 = 0.115（积分从未触界）
    # 原来手工标定的 0.1325 / 0.0 / 0.11 里，二号边的 0.0 是明显的错值，
    # 有界积分只能补上其中的 0.08。
    p5_right_slope_1_vy: 0.115
    p5_right_slope_1_after_center_lost_vy: 0.115
    # 0.120 又过了头：饱和消失了（触界从 50% 降到 14%，积分中位回到 0.000），
    # 但段内稳态偏差从 +0.037 翻到 -0.027，也就是从下坡侧漂变成上坡侧漂，
    # 四跑掉在二号边的 -x（上坡）一侧，x 约 -0.9。
    # 两次实测把真值夹在 0.043（明显不足）和 0.120（略过）之间，取中点。
    p5_right_slope_2_vy: 0.105
    p5_right_slope_2_after_center_lost_vy: 0.105
    p5_right_slope_3_vy: 0.115
    p5_right_slope_3_after_center_lost_vy: 0.115

    # === 九、停滞检测与站起重试（计划书第 11 条）===
    #
    # 机体在桥面入口台阶前塌成劈叉：真值 z 从 0.30 掉到 0.13（比在平地上
    # 站着还低），命令 vx=0.45 而里程钉在 0.20 m，一直耗到 45 s 状态超时。
    # 十一跑里三跑这样。卡住的时候机体还会绕着卡点转，于是横向回路把航向
    # 权限打满去纠正一个动不了的机体——日志上看起来像转向故障，其实不是。
    #
    # 判据必须是“命令在走 + 里程不动”这一对，只看计时器会把正常的原地
    # 转向也判成停滞。8 s 远长于任何正常的慢步（实测停滞持续 40 s），
    # 0.05 m 高于估计器站立时几毫米的抖动。
    #
    # 处置是站起来再从原状态继续，而不是像摔倒那样保持不动：摔倒会毁掉
    # 腿式里程计的位置状态（计划书第 37 条），而停滞不会——机体姿态是平的、
    # 位置估计和一秒前一样好，只是腿劈开了顶着台阶。所以这条阶梯**要求**
    # 姿态确认机体没倒，倒了的走摔倒那条路。段进度不重置（重入同一段时
    # p5_route_enter_segment 提前返回），所以站起来之后不会把爬坡从头再算。
    # 8.0 -> 4.0：8 s 太慢，机体先翻了。实测两跑（十六跑）卡在入口台阶上
    # 从停滞到翻倒只有 6~8 s——卡住的机体会绕着卡点转，航向误差从 0.03
    # 涨到 0.85 rad，回路一直以 wz=+0.25 顶着，然后侧翻。一跑根本没等到
    # 停滞门就翻了，另一跑站起来时已经太歪、随即又翻。
    # 误报余量仍然很大：min_progress 0.05 m 在 vx=0.45 时正常只要 0.11 s，
    # 即使在 centre-first 的 0.12 m/s 下也只要 0.4 s，4 s 是十倍余量。
    p5_route_stall_timeout_s: 4.0
    p5_route_stall_min_speed: 0.05
    p5_route_stall_min_progress_m: 0.05
    p5_route_stall_max_attempts: 1

    # === 十、四号转角：把起跳分布对准窗口，并压掉开环那一段的散布 ===
    #
    # 两批共二十五次四号转角起跳，成败按起跳位置分得很干净：
    #   起跳 x <= 3.022 的六跑：转角 -24 ~ -60 度，全部失败
    #   起跳 x 3.026 ~ 3.162 的十八跑：转角 -81 ~ -88 度，十五跑完赛
    #   起跳 x = 3.174：转 +13 度，失败
    # 也就是可用窗口约 [3.026, 3.162]，宽 0.14 m，窗口中心 3.094；
    # 而实测起跳分布跨度 0.17 m、中位只有 3.07——**比窗口还宽，而且偏低**。
    #
    # 两件事分开做：
    # (a) 对中：段长 +0.02（起跳点与段长约 1.15:1）把中位推到 3.094。
    # (b) 压散布：段尾那 1.5 s 的定时前进是纯开环，0.45 m 里带着自己的
    #     速度散布，而且完全不受里程门约束。缩到 0.8 s（0.24 m），把省下的
    #     0.21 m 交给里程门去量。窗口上限必须跟着抬，否则 overrun 会误判。
    #
    # 只有 (b) 能真正提高上限：窗口 0.14 m 比散布 0.17 m 窄，光对中最好也
    # 还有两成落在窗口外。彻底的做法是用深度的前向跌落做转角触发
    # （见 README 第 12 节），那是课程参照量、不累积误差。
    p5_route_straight_3_expected_m: 3.11
    p5_route_straight_3_min_m: 2.80
    p5_route_straight_3_max_m: 3.45
    p5_right_slope_3_after_center_lost_duration_s: 0.80

    # === 十一、入口台阶：抬脚高度与重试次数 ===
    #
    # 四号转角对准之后，最大的一档失败回到了桥面入口台阶（十六跑三跑）。
    # 三跑的形态：机体在 y≈7.5~8.1 顶着台阶停住，停滞门 4 s 触发、站起来，
    # 然后 r09 又停一次（重试用完判故障），r06/r08 在站起过程里侧翻
    # （结束姿态 roll +1.66 / +1.81，z 0.13~0.15）。
    #
    # 两处调整：
    # (a) **实测否决。** 猜想是“台阶 0.13 m 高而爬坡只抬脚 0.10 m，脚挂在
    #     台阶唇上”，于是把爬坡抬脚高度也设成 0.13。十六跑的结果正相反：
    #     卡在入口台阶的从 3/16 变成 10/16，完赛 8/16 -> 1/16。
    #     抬得更高不是帮着迈过台阶，而是把坡上的步态弄不稳了。恢复 0.10。
    #     记在这里是为了别再试一次；入口台阶的真正机理仍未查明。
    # (b) 停滞重试 1 -> 2。r09 站起来之后又停了一次，第二次没有额度。
    #     上限仍由状态超时（60 s）兜底，不会变成无限重试。这一项保留。
    p5_up_slope_step_height: 0.10
    p5_route_stall_max_attempts: 2
